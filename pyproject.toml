[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "data-contract-observatory"
version = "0.1.0"
description = "Inspectable monitoring for a real public-data contract"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "David Lindgreen" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.scripts]
contract-observe = "data_contract_observatory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

