[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "data-contract-observatory"
version = "1.0.0"
description = "Inspectable monitoring for a real public-data contract"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "David Lindgreen" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.6",
  "mypy>=1.13",
  "ruff>=0.8",
]

[project.scripts]
contract-observe = "data_contract_observatory.cli:main"
contract-ledger = "data_contract_observatory.ledger:main"
contract-evaluate-v1 = "data_contract_observatory.validation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true

[tool.coverage.run]
source = ["data_contract_observatory"]

[tool.coverage.report]
fail_under = 75
