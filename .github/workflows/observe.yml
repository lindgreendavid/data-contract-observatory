name: Observe ECB contract

on:
  schedule:
    - cron: "20 17 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  observe:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Observe the pinned public-data contract
        id: observer
        continue-on-error: true
        run: contract-observe --raw-output /tmp/ecb-current.csv --output site/data/latest.json
      - name: Update append-only evidence branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f /tmp/ecb-current.csv ]; then exit 0; fi
          git fetch origin evidence || true
          if git show-ref --verify --quiet refs/remotes/origin/evidence; then
            git worktree add /tmp/observatory-evidence origin/evidence
          else
            git worktree add --detach /tmp/observatory-evidence
            git -C /tmp/observatory-evidence switch --orphan evidence
            git -C /tmp/observatory-evidence rm -rf .
          fi
          contract-ledger --input /tmp/ecb-current.csv --report site/data/latest.json --evidence-dir /tmp/observatory-evidence
          cp /tmp/observatory-evidence/index.json site/data/evidence-index.json
          git -C /tmp/observatory-evidence add index.json state.json runs
          if ! git -C /tmp/observatory-evidence diff --cached --quiet; then
            git -C /tmp/observatory-evidence -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "chore(evidence): record contract observation"
            git -C /tmp/observatory-evidence push origin HEAD:evidence
          fi
      - name: Preserve the auditable run
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ecb-contract-observation-${{ github.run_id }}
          path: site/data/latest.json
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      - name: Deploy observed state to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
