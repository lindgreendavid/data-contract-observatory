name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Validate contract and mutation tests
        run: python -m unittest discover -s tests -v
      - name: Compile package
        run: python -m compileall -q src

  site-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Validate JavaScript syntax
        run: node --check site/app.js
      - name: Validate required site surfaces
        run: |
          grep -q 'Interactive validation' site/index.html
          grep -q 'Epistemic boundary' site/index.html
          grep -q 'prefers-reduced-motion' site/styles.css
